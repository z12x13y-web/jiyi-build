name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.1'
        required: true
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p src
          tar -xzf Jiyi-src.tar.gz -C src --strip-components=1

      - name: Ensure persistent keystore
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ ! -f keystore/release.b64 ]; then
            echo "首次运行：生成签名密钥并提交到仓库，后续构建复用同一个签名"
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias jiyi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jiyi-ci-pass -keypass jiyi-ci-pass \
              -dname "CN=Jiyi, O=Jiyi, C=CN"
            base64 -w0 keystore/release.jks > keystore/release.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/release.b64
            git commit -m "chore: add persistent release keystore" || true
            git push || echo "WARN: push failed, keystore only lives in this run"
          fi
          base64 -d keystore/release.b64 > src/android/app/pinevault-release.jks
          cp src/android/app/pinevault-release.jks src/android/pinevault-release.jks
          printf 'storePassword=jiyi-ci-pass\nkeyPassword=jiyi-ci-pass\nkeyAlias=jiyi\nstoreFile=pinevault-release.jks\n' > src/android/key.properties

      - name: Build release APK
        working-directory: src
        run: flutter build apk --release

      - name: Collect APK
        run: |
          set -euo pipefail
          cp src/build/app/outputs/flutter-apk/app-release.apk "Jiyi-${{ github.event.inputs.tag }}.apk"
          ls -lh "Jiyi-${{ github.event.inputs.tag }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: 记忆 ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: Jiyi-${{ github.event.inputs.tag }}.apk
