name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: 解压源码
        run: |
          mkdir -p src
          tar -xzf Jiyi-src.tar.gz -C src --strip-components=1
          ls src

      - name: 拉取依赖
        working-directory: src
        run: flutter pub get

      - name: 生成签名
        working-directory: src
        run: |
          keytool -genkeypair -v -keystore android/app/pinevault-release.jks \
            -alias jiyi -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jiyi-ci-pass -keypass jiyi-ci-pass \
            -dname "CN=Jiyi, O=Jiyi, C=CN"
          cp android/app/pinevault-release.jks android/pinevault-release.jks
          printf 'storePassword=jiyi-ci-pass\nkeyPassword=jiyi-ci-pass\nkeyAlias=jiyi\nstoreFile=pinevault-release.jks\n' > android/key.properties

      - name: 编译 APK
        working-directory: src
        run: flutter build apk --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Jiyi-Android
          path: src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
